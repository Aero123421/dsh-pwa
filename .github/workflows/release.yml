name: Publish plugin release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release tag and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/)
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`)
          assert.ok(readFileSync(`docs/release-${pkg.version}.md`, 'utf8').trim())
          NODE
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check the DSH peer against the published app-boot alpha
        run: npm run check:dsh-peer
      - name: Check distributed JavaScript
        run: |
          node --check index.js
          node --check client.js
          node --check updates.js
      - name: Pack release files
        run: |
          npm pack --ignore-scripts
          sha256sum dsh-pwa-*.tgz > SHA256SUMS
      - name: Create a draft Release or attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-assets.mjs dsh-pwa-*.tgz SHA256SUMS
