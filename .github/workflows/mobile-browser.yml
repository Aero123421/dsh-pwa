name: Mobile browser verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client.js'
      - 'index.js'
      - 'package*.json'
      - 'assets/**'
      - 'test/**'
      - 'scripts/browser-check.mjs'
      - 'scripts/pwa-proxy-check.mjs'
      - 'scripts/touch-scroll-check.mjs'
      - 'scripts/check-dsh-peer.mjs'
      - '.github/workflows/mobile-browser.yml'
permissions:
  contents: read
concurrency:
  group: mobile-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Accepted versions at 2026-10-29 15:00 UTC; keep rc.4 as a regression target.
        dsh: ['0.2.1-alpha.2', '0.2.1-rc.2', '0.2.1-rc.4', '0.2.1-rc.5', '0.2.2-alpha.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm install --global @deepseek-ai/dsh@${{ matrix.dsh }} pnpm@11.28.5
      - run: npm run check:dsh-peer -- ${{ matrix.dsh }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/pwa-proxy-check.mjs
      - run: npm pack --ignore-scripts
      - run: npm run test:browser
        env:
          DSH_TELEMETRY_MODE: DISABLED
      - run: npm run test:touch
        env:
          DSH_TELEMETRY_MODE: DISABLED
      - name: Collect isolated browser evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/pwa-browser-evidence
          shopt -s nullglob
          for image in /tmp/dsh-pwa-smoke-*/*.png /tmp/dsh-pwa-touch-*/*.png; do cp "$image" /tmp/pwa-browser-evidence/; done
          # Only the freshly generated fixture's bootstrap command log is printed.
          # Server logs and authentication URLs are not uploaded.
          for log in /tmp/dsh-pwa-smoke-*/command.log; do
            sed -E 's/(token=)[^[:space:]"&]+/\1[redacted]/g' "$log" | tail -40
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-screenshots-${{ matrix.dsh }}
          path: /tmp/pwa-browser-evidence/*.png
          if-no-files-found: ignore
          retention-days: 14
