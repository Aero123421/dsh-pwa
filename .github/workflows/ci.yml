name: PWA plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ripgrep when the runner does not have it
        run: command -v rg >/dev/null || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Published files must not call addLanguage
        run: npm run check:no-add-language
      - name: Check the DSH peer against the published app-boot alpha
        run: npm run check:dsh-peer
