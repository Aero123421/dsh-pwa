name: PWA plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Published source must not call addLanguage
        run: rc=0; grep -rnF addLanguage client.js index.js updates.js || rc=$?; test "$rc" -eq 1
      - name: Check the DSH peer against the lower bound and published channels
        run: npm run check:dsh-peer
